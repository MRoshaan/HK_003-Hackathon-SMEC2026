<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UniGigs - Student Task Market</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 0 auto; padding: 20px; }
        
        /* Auth Screen */
        #authScreen { display: flex; justify-content: center; align-items: center; height: 100vh; flex-direction: column; }
        .auth-box { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); width: 300px; text-align: center; }
        .auth-box input { width: 90%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; }
        .btn { background: #4a90e2; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        .btn:hover { background: #357abd; }
        .btn-secondary { background: #eee; color: #333; margin-top: 5px; }

        /* Dashboard */
        #dashboard { display: none; }
        header { background: #ffffff; padding: 15px 0; border-bottom: 1px solid #ddd; margin-bottom: 20px; }
        .header-content { display: flex; justify-content: space-between; align-items: center; max-width: 900px; margin: 0 auto; padding: 0 20px; }
        .logo { font-size: 24px; font-weight: bold; color: #4a90e2; }
        .nav-tabs { display: flex; gap: 20px; }
        .tab { cursor: pointer; padding-bottom: 5px; font-weight: 500; color: #666; }
        .tab.active { color: #4a90e2; border-bottom: 2px solid #4a90e2; }

        /* Task Cards */
        .task-card { background: white; padding: 20px; border-radius: 8px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: relative; }
        .task-header { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .task-title { font-size: 18px; font-weight: bold; color: #333; }
        .task-budget { background: #e8f5e9; color: #2e7d32; padding: 5px 10px; border-radius: 15px; font-weight: bold; font-size: 14px; }
        .task-desc { color: #666; margin-bottom: 15px; line-height: 1.5; }
        .task-meta { font-size: 12px; color: #999; display: flex; justify-content: space-between; align-items: center; }
        
        .bid-section { background: #f9f9f9; padding: 15px; border-radius: 5px; margin-top: 15px; }
        .bid-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #eee; }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 8px; width: 400px; }
        .close { float: right; cursor: pointer; font-size: 20px; }

        .hidden { display: none !important; }
        .portfolio-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; }
        .portfolio-item { background: white; border: 1px solid #eee; padding: 15px; border-radius: 8px; }
        .badge { display: inline-block; padding: 3px 8px; border-radius: 4px; font-size: 11px; background: #eee; color: #555; }
    </style>
</head>
<body>

    <div id="authScreen">
        <div class="auth-box">
            <h2 style="color:#4a90e2;">UniGigs</h2>
            <input type="text" id="username" placeholder="Username">
            <button class="btn" onclick="login()">Login / Signup</button>
        </div>
    </div>

    <div id="dashboard">
        <header>
            <div class="header-content">
                <div class="logo">UniGigs</div>
                <div class="nav-tabs">
                    <div class="tab active" onclick="switchTab('market')" id="tab-market">Gig Market</div>
                    <div class="tab" onclick="switchTab('portfolio')" id="tab-portfolio">My Portfolio</div>
                </div>
                <div>
                    <span id="userDisplay" style="margin-right:15px; font-weight:bold;"></span>
                    <button onclick="logout()" style="background:none; border:none; cursor:pointer; color:red;">Logout</button>
                </div>
            </div>
        </header>

        <div class="container">
            
            <div id="view-market">
                <div style="text-align:right; margin-bottom:20px;">
                    <button class="btn" style="width:auto;" onclick="openPostModal()">+ Post New Gig</button>
                </div>
                <div id="taskList"></div>
            </div>

            <div id="view-portfolio" class="hidden">
                <h2>Completed Projects</h2>
                <div id="portfolioList" class="portfolio-grid"></div>
            </div>

        </div>
    </div>

    <div id="postModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('postModal')">&times;</span>
            <h3>Post a New Gig</h3>
            <input type="text" id="postTitle" placeholder="Task Title (e.g. Need Logo Design)" style="width:95%; padding:10px; margin-bottom:10px;">
            <textarea id="postDesc" rows="4" placeholder="Description" style="width:95%; padding:10px; margin-bottom:10px;"></textarea>
            <input type="number" id="postBudget" placeholder="Budget ($)" style="width:95%; padding:10px; margin-bottom:10px;">
            <button class="btn" onclick="submitTask()">Post Gig</button>
        </div>
    </div>

    <div id="bidModal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('bidModal')">&times;</span>
            <h3>Place Your Bid</h3>
            <p id="bidTargetTitle"></p>
            <input type="number" id="bidAmount" placeholder="Your Offer ($)" style="width:95%; padding:10px; margin-bottom:10px;">
            <input type="text" id="bidTime" placeholder="Time to complete (e.g. 2 days)" style="width:95%; padding:10px; margin-bottom:10px;">
            <button class="btn" onclick="submitBid()">Submit Bid</button>
        </div>
    </div>

<script>
    // State
    let currentUser = null;
    let currentTaskId = null;
    
    // Load Data
    let tasks = JSON.parse(localStorage.getItem('uniGigs_tasks')) || [
        { id: 1, title: "Fix my Python script", desc: "Need help debugging a loop issue in Task 5.", budget: 20, author: "Alice", status: "open", bids: [], completedBy: null },
        { id: 2, title: "Logo for Startup", desc: "Minimalist logo needed for a tech club.", budget: 50, author: "Bob", status: "open", bids: [], completedBy: null }
    ];

    // Auth Logic
    function login() {
        const user = document.getElementById('username').value;
        if(!user) return alert("Enter a username");
        currentUser = user;
        localStorage.setItem('uniGigs_user', user);
        initApp();
    }

    function logout() {
        localStorage.removeItem('uniGigs_user');
        location.reload();
    }

    function initApp() {
        const storedUser = localStorage.getItem('uniGigs_user');
        if (storedUser) {
            currentUser = storedUser;
            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('dashboard').style.display = 'block';
            document.getElementById('userDisplay').textContent = currentUser;
            renderTasks();
            renderPortfolio();
        }
    }

    // Tabs
    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.getElementById('tab-' + tab).classList.add('active');
        
        if (tab === 'market') {
            document.getElementById('view-market').classList.remove('hidden');
            document.getElementById('view-portfolio').classList.add('hidden');
            renderTasks();
        } else {
            document.getElementById('view-market').classList.add('hidden');
            document.getElementById('view-portfolio').classList.remove('hidden');
            renderPortfolio();
        }
    }

    // Task Logic
    function renderTasks() {
        const container = document.getElementById('taskList');
        container.innerHTML = '';

        tasks.forEach(task => {
            if (task.status === 'closed' && task.author !== currentUser && task.completedBy !== currentUser) return; // Hide closed tasks unless involved

            const isOwner = task.author === currentUser;
            const el = document.createElement('div');
            el.className = 'task-card';
            
            let actionArea = '';
            
            if (task.status === 'closed') {
                actionArea = `<div style="color:green; font-weight:bold; margin-top:10px;">✅ Completed by ${task.completedBy}</div>`;
            } else if (isOwner) {
                // Owner View: See bids
                let bidsHtml = task.bids.length ? task.bids.map(b => `
                    <div class="bid-item">
                        <span><strong>${b.bidder}</strong>: $${b.amount} in ${b.time}</span>
                        <button onclick="acceptBid(${task.id}, '${b.bidder}')" style="background:#2ecc71; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">Accept</button>
                    </div>
                `).join('') : '<p style="color:#777; font-size:13px;">No bids yet.</p>';
                
                actionArea = `<div class="bid-section"><h4>Received Bids</h4>${bidsHtml}</div>`;
            } else {
                // Public View: Bid button
                const alreadyBid = task.bids.find(b => b.bidder === currentUser);
                if (alreadyBid) {
                    actionArea = `<div style="margin-top:10px; color:#4a90e2;">Bid sent: $${alreadyBid.amount}</div>`;
                } else {
                    actionArea = `<button class="btn" style="margin-top:10px;" onclick="openBidModal(${task.id}, '${task.title}')">Place Bid</button>`;
                }
            }

            el.innerHTML = `
                <div class="task-header">
                    <span class="task-title">${task.title}</span>
                    <span class="task-budget">$${task.budget}</span>
                </div>
                <div class="task-desc">${task.desc}</div>
                <div class="task-meta">
                    <span>Posted by: <strong>${task.author}</strong></span>
                    <span>${task.bids.length} Bids</span>
                </div>
                ${actionArea}
            `;
            container.appendChild(el);
        });
    }

    function renderPortfolio() {
        const container = document.getElementById('portfolioList');
        const myWorks = tasks.filter(t => t.completedBy === currentUser && t.status === 'closed');
        
        if (myWorks.length === 0) {
            container.innerHTML = '<p>No completed tasks yet. Go win some bids!</p>';
            return;
        }

        container.innerHTML = myWorks.map(t => `
            <div class="portfolio-item">
                <h3>${t.title}</h3>
                <p style="font-size:13px; color:#666;">${t.desc}</p>
                <div style="margin-top:10px;">
                    <span class="badge">Earned: $${t.finalPrice || t.budget}</span>
                    <span class="badge">Client: ${t.author}</span>
                </div>
            </div>
        `).join('');
    }

    // Actions
    function submitTask() {
        const title = document.getElementById('postTitle').value;
        const desc = document.getElementById('postDesc').value;
        const budget = document.getElementById('postBudget').value;

        if (!title || !budget) return alert("Fill all fields");

        tasks.unshift({
            id: Date.now(),
            title,
            desc,
            budget,
            author: currentUser,
            status: 'open',
            bids: [],
            completedBy: null
        });

        saveAndRefresh();
        closeModal('postModal');
    }

    function openPostModal() { document.getElementById('postModal').style.display = 'flex'; }
    
    function openBidModal(id, title) {
        currentTaskId = id;
        document.getElementById('bidTargetTitle').innerText = title;
        document.getElementById('bidModal').style.display = 'flex';
    }

    function submitBid() {
        const amount = document.getElementById('bidAmount').value;
        const time = document.getElementById('bidTime').value;
        
        const task = tasks.find(t => t.id === currentTaskId);
        task.bids.push({ bidder: currentUser, amount, time });
        
        saveAndRefresh();
        closeModal('bidModal');
    }

    function acceptBid(taskId, winner) {
        const task = tasks.find(t => t.id === taskId);
        const winningBid = task.bids.find(b => b.bidder === winner);
        
        if(confirm(`Accept ${winner}'s bid for $${winningBid.amount}?`)) {
            task.status = 'closed';
            task.completedBy = winner;
            task.finalPrice = winningBid.amount;
            saveAndRefresh();
        }
    }

    function saveAndRefresh() {
        localStorage.setItem('uniGigs_tasks', JSON.stringify(tasks));
        renderTasks();
    }

    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    // Start
    initApp();

</script>
</body>
</html>
