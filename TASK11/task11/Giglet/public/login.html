<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login - Giglet</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--card);">
    <div class="container" style="max-width: 400px; padding-top: 7rem;">
        <div style="text-align: center; margin-bottom: 2.5rem;">
            <a href="index.html" class="logo" style="justify-content: center; font-size: 1.75rem; margin-bottom: 1rem;">Giglet</a>
            <h2 style="font-weight: 800; letter-spacing: -0.02em;">Welcome back</h2>
            <p style="color: var(--muted); margin-top: 0.5rem;">Enter your credentials to continue.</p>
        </div>

        <form id="login-form">
            <div id="login-feedback" style="display: none; margin-bottom: 1.5rem;"></div>
            <div class="form-group">
                <label>Username</label>
                <input type="text" name="username" placeholder="johndoe" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" name="password" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-accent" style="width: 100%; height: 3rem;">Sign In</button>
        </form>
        
        <p style="margin-top: 1.5rem; text-align: center; font-size: 0.875rem; color: var(--muted);">
            Don't have an account? <a href="register.html" style="color: var(--accent); font-weight: 600; text-decoration: none;">Sign up</a>
        </p>
    </div>

    <script src="js/auth.js"></script>
    <script>
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const feedback = document.getElementById('login-feedback');
            Auth.login(formData.get('username'), formData.get('password'), feedback);
        });
    </script>
</body>
</html>
