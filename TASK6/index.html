<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeetCollab Video and Whiteboard</title>
    <style>
        body { margin: 0; font-family: sans-serif; background: #202124; color: white; height: 100vh; display: flex; flex-direction: column; }
        
        .main-container { flex: 1; display: flex; overflow: hidden; position: relative; }
        .video-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 10px; padding: 20px; }
        .video-card { background: #3c4043; border-radius: 8px; position: relative; overflow: hidden; display: flex; align-items: center; justify-content: center; }
        .video-card video { width: 100%; height: 100%; object-fit: cover; }
        .name-tag { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.5); padding: 5px 10px; border-radius: 4px; font-size: 12px; }
        #whiteboard-container { display: none; background: white; flex: 1; border-left: 1px solid #555; position: relative; cursor: crosshair; }
        canvas { display: block; width: 100%; height: 100%; }
        .wb-controls { position: absolute; top: 10px; left: 10px; background: #eee; padding: 5px; border-radius: 5px; display: flex; gap: 5px; }
        .color-btn { width: 20px; height: 20px; border-radius: 50%; border: 1px solid #ccc; cursor: pointer; }

        .controls { height: 70px; background: #202124; border-top: 1px solid #3c4043; display: flex; align-items: center; justify-content: center; gap: 15px; }
        .btn { background: #3c4043; border: none; border-radius: 50%; width: 50px; height: 50px; color: white; cursor: pointer; font-size: 1.2em; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn:hover { background: #505559; }
        .btn.active { background: #8ab4f8; color: #202124; }
        .btn.danger { background: #ea4335; }
       
        #fileInput { display: none; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="video-grid" id="videoGrid">
            <div class="video-card">
                <video id="myVideo" autoplay muted playsinline></video>
                <div class="name-tag">You (Host)</div>
            </div>
            <div class="video-card">
                <img src="https://via.placeholder.com/400x300/333/fff?text=Peer+User" style="width:100%; height:100%; object-fit:cover;">
                <div class="name-tag">Jane Doe</div>
            </div>
        </div>

        <div id="whiteboard-container">
            <div class="wb-controls">
                <div class="color-btn" style="background:black" onclick="setColor('black')"></div>
                <div class="color-btn" style="background:red" onclick="setColor('red')"></div>
                <div class="color-btn" style="background:blue" onclick="setColor('blue')"></div>
                <button onclick="clearBoard()" style="font-size:12px; cursor:pointer;">Clear</button>
            </div>
            <canvas id="wbCanvas"></canvas>
        </div>
    </div>

    <div class="controls">
        <button class="btn" onclick="toggleMute()">🎤</button>
        <button class="btn" onclick="toggleVideo()">📷</button>
        
        <button class="btn" onclick="shareScreen()" title="Share Screen">🖥️</button>
        
        <button class="btn" onclick="document.getElementById('fileInput').click()" title="Send File">📁</button>
        <input type="file" id="fileInput" onchange="handleFile(this)">
        
        <button class="btn" id="wbBtn" onclick="toggleWhiteboard()" title="Whiteboard">✏️</button>
        
        <button class="btn danger" onclick="alert('Call Ended')">📞</button>
    </div>

<script>
    async function startVideo() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
            document.getElementById('myVideo').srcObject = stream;
        } catch (err) {
            console.error("Camera access denied or error:", err);
            alert("Please allow camera access to see the video feature.");
        }
    }

    async function shareScreen() {
        try {
            const stream = await navigator.mediaDevices.getDisplayMedia({ video: true });
            document.getElementById('myVideo').srcObject = stream;
            
            stream.getVideoTracks()[0].onended = () => startVideo();
        } catch (err) {
            console.log("Screen share cancelled");
        }
    }

    function handleFile(input) {
        if(input.files.length > 0) {
            alert(`File "${input.files[0].name}" uploaded and shared with peers!`);
        }
    }
    const wbContainer = document.getElementById('whiteboard-container');
    const canvas = document.getElementById('wbCanvas');
    const ctx = canvas.getContext('2d');
    let painting = false;
    let currentColor = 'black';

    function resizeCanvas() {
        canvas.width = wbContainer.offsetWidth;
        canvas.height = wbContainer.offsetHeight;
    }

    function toggleWhiteboard() {
        const isHidden = wbContainer.style.display === 'none' || wbContainer.style.display === '';
        
        if (isHidden) {
            wbContainer.style.display = 'block';
            document.getElementById('wbBtn').classList.add('active');
            resizeCanvas();
        } else {
            wbContainer.style.display = 'none';
            document.getElementById('wbBtn').classList.remove('active');
        }
    }
    function startPosition(e) {
        painting = true;
        draw(e);
    }
    function endPosition() {
        painting = false;
        ctx.beginPath();
    }
    function draw(e) {
        if (!painting) return;
        
        const rect = canvas.getBoundingClientRect();
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.strokeStyle = currentColor;
        
        ctx.lineTo(e.clientX - rect.left, e.clientY - rect.top);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(e.clientX - rect.left, e.clientY - rect.top);
    }
    canvas.addEventListener('mousedown', startPosition);
    canvas.addEventListener('mouseup', endPosition);
    canvas.addEventListener('mousemove', draw);
    window.addEventListener('resize', resizeCanvas);

    function setColor(color) { currentColor = color; }
    function clearBoard() { ctx.clearRect(0, 0, canvas.width, canvas.height); }
    startVideo();
</script>

</body>
</html>
