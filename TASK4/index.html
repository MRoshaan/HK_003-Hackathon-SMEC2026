<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Shopping Cart</title>
    <style>
        body { font-family: sans-serif; max-width: 1200px; margin: 0 auto; padding: 20px; background-color: #f9f9f9; }
        h1 { text-align: center; color: #333; }
        
        .container { display: flex; gap: 20px; }
        
        .product-list { flex: 2; display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); text-align: center; display: flex; flex-direction: column; justify-content: space-between; }
        .card img { width: 100px; height: 100px; object-fit: contain; margin: 0 auto; }
        .price { color: #28a745; font-weight: bold; font-size: 1.1em; margin: 10px 0; }
        button.add-btn { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; cursor: pointer; }
        button.add-btn:hover { background: #0056b3; }
        .cart-section { flex: 1; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); height: fit-content; }
        .cart-item { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding: 10px 0; }
        .cart-controls button { width: 25px; height: 25px; cursor: pointer; border: 1px solid #ddd; background: #f8f8f8; }
        .remove-btn { color: red; cursor: pointer; font-size: 0.9em; margin-left: 10px; text-decoration: underline; }
        .total-price { font-size: 1.5em; font-weight: bold; text-align: right; margin-top: 20px; border-top: 2px solid #333; padding-top: 10px; }
    </style>
</head>
<body>

    <h1>Smart Cart Demo</h1>

    <div class="container">
        <div class="product-list" id="products">
            <p>Loading products...</p>
        </div>

        <div class="cart-section">
            <h2>Your Cart</h2>
            <div id="cartItems">
                <p>Cart is empty.</p>
            </div>
            <div class="total-price">Total: $<span id="cartTotal">0</span></div>
            <button onclick="clearCart()" style="margin-top:10px; background:#dc3545; color:white; border:none; padding:5px 10px; border-radius:3px; cursor:pointer;">Clear Cart</button>
        </div>
    </div>

<script>
    let cart = JSON.parse(localStorage.getItem('mySmartCart')) || [];
    let products = [];

    async function fetchProducts() {
        try {
            const res = await fetch('https://dummyjson.com/products?limit=8');
            const data = await res.json();
            products = data.products;
            renderProducts();
            renderCart();
            console.error(err);
        }
    }
    function renderProducts() {
        const container = document.getElementById('products');
        container.innerHTML = products.map(p => `
            <div class="card">
                <img src="${p.thumbnail}" alt="${p.title}">
                <h4>${p.title}</h4>
                <div class="price">$${p.price}</div>
                <button class="add-btn" onclick="addToCart(${p.id})">Add to Cart</button>
            </div>
        `).join('');
    }
    function addToCart(id) {
        const product = products.find(p => p.id === id);
        const existingItem = cart.find(item => item.id === id);

        if (existingItem) {
            existingItem.quantity++;
        } else {
            cart.push({ ...product, quantity: 1 });
        }
        updateCart();
    }

    function updateQuantity(id, change) {
        const item = cart.find(item => item.id === id);
        if (item) {
            item.quantity += change;
            if (item.quantity <= 0) removeFromCart(id);
            else updateCart();
        }
    }

    function removeFromCart(id) {
        cart = cart.filter(item => item.id !== id);
        updateCart();
    }

    function clearCart() {
        cart = [];
        updateCart();
    }
    function updateCart() {
        localStorage.setItem('mySmartCart', JSON.stringify(cart));
        renderCart();
    }
    function renderCart() {
        const container = document.getElementById('cartItems');
        const totalSpan = document.getElementById('cartTotal');
        
        if (cart.length === 0) {
            container.innerHTML = '<p>Cart is empty.</p>';
            totalSpan.innerText = '0';
            return;
        }

        let total = 0;
        container.innerHTML = cart.map(item => {
            total += item.price * item.quantity;
            return `
                <div class="cart-item">
                    <div>
                        <strong>${item.title}</strong><br>
                        $${item.price} x ${item.quantity}
                    </div>
                    <div class="cart-controls">
                        <button onclick="updateQuantity(${item.id}, -1)">-</button>
                        <span>${item.quantity}</span>
                        <button onclick="updateQuantity(${item.id}, 1)">+</button>
                        <span class="remove-btn" onclick="removeFromCart(${item.id})">Remove</span>
                    </div>
                </div>
            `;
        }).join('');
        totalSpan.innerText = total.toFixed(2);
    }
    fetchProducts();
</script>

</body>
</html>
