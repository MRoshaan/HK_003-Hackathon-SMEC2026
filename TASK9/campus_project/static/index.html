<!DOCTYPE html>
<html>
<head>
    <title>Campus Booking</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>🏫 Campus Resource Booking</h2>
    
    <div class="card p-4 mt-3">
        <form id="bookingForm">
            <div class="mb-3">
                <label>Your Name:</label>
                <input type="text" id="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>Select Resource:</label>
                <select id="resourceSelect" class="form-control"></select>
            </div>
            <div class="mb-3">
                <label>Start Time:</label>
                <input type="datetime-local" id="startTime" class="form-control" required>
            </div>
            <div class="mb-3">
                <label>End Time:</label>
                <input type="datetime-local" id="endTime" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary">Book Now</button>
        </form>
        <div id="message" class="mt-3"></div>
    </div>

    <script>
        // Load Resources on Page Load
        async function loadResources() {
            const res = await fetch('/resources/');
            const data = await res.json();
            const select = document.getElementById('resourceSelect');
            data.forEach(r => {
                const opt = document.createElement('option');
                opt.value = r.id;
                opt.innerText = `${r.name} (${r.type})`;
                select.appendChild(opt);
            });
        }
        loadResources();

        // Handle Booking
        document.getElementById('bookingForm').onsubmit = async (e) => {
            e.preventDefault();
            const payload = {
                user_name: document.getElementById('username').value,
                resource_id: document.getElementById('resourceSelect').value,
                start_time: document.getElementById('startTime').value,
                end_time: document.getElementById('endTime').value
            };

            const res = await fetch('/bookings/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });

            const result = await res.json();
            const msgDiv = document.getElementById('message');
            if (res.ok) {
                msgDiv.innerHTML = `<div class="alert alert-success">Booking Pending! ID: ${result.id}</div>`;
            } else {
                msgDiv.innerHTML = `<div class="alert alert-danger">Error: ${result.detail}</div>`;
            }
        };
    </script>
</body>
</html>
