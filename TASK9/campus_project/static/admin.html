<!DOCTYPE html>
<html>
<head>
    <title>Admin Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>👮 Admin Dashboard</h2>
    
    <div class="card p-3 mb-4">
        <h5>Add New Resource</h5>
        <div class="input-group">
            <input type="text" id="resName" class="form-control" placeholder="Name (e.g. Lab 1)">
            <input type="text" id="resType" class="form-control" placeholder="Type (e.g. Lab)">
            <input type="number" id="resCap" class="form-control" placeholder="Capacity">
            <button onclick="addResource()" class="btn btn-success">Add</button>
        </div>
    </div>

    <h4>Booking Requests</h4>
    <table class="table table-bordered">
        <thead>
            <tr><th>ID</th><th>User</th><th>Resource</th><th>Time</th><th>Status</th><th>Action</th></tr>
        </thead>
        <tbody id="bookingTable"></tbody>
    </table>

    <script>
        async function loadBookings() {
            const res = await fetch('/bookings/');
            const data = await res.json();
            const tbody = document.getElementById('bookingTable');
            tbody.innerHTML = '';
            
            data.forEach(b => {
                const row = `<tr>
                    <td>${b.id}</td>
                    <td>${b.user_name}</td>
                    <td>${b.resource.name}</td>
                    <td>${b.start_time} <br>to<br> ${b.end_time}</td>
                    <td><span class="badge bg-${b.status === 'approved' ? 'success' : b.status === 'rejected' ? 'danger' : 'warning'}">${b.status}</span></td>
                    <td>
                        ${b.status === 'pending' ? `
                        <button class="btn btn-sm btn-success" onclick="updateStatus(${b.id}, 'approved')">✔</button>
                        <button class="btn btn-sm btn-danger" onclick="updateStatus(${b.id}, 'rejected')">✖</button>
                        ` : ''}
                    </td>
                </tr>`;
                tbody.innerHTML += row;
            });
        }

        async function updateStatus(id, status) {
            await fetch(`/bookings/${id}/status?status=${status}`, { method: 'PUT' });
            loadBookings();
        }

        async function addResource() {
            await fetch('/resources/', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    name: document.getElementById('resName').value,
                    type: document.getElementById('resType').value,
                    capacity: document.getElementById('resCap').value
                })
            });
            alert("Resource Added!");
        }

        loadBookings();
    </script>
</body>
</html>
